; COMETA · Firmware
;
; Un solo proyecto PlatformIO con dos entornos independientes
; (REQUISITOS.md §1, §2):
;   - teensy41   -> src/teensy/     -> cadena científica completa (nivel 3)
;   - adalogger  -> src/adalogger/  -> posición y altitud de respaldo (nivel 2)
;
; Las dos cadenas no comparten bus, alimentación ni masa: cada entorno
; compila solo su propio directorio en src/ mediante build_src_filter.
; src/banco/ (entorno banco) tiene su propio setup()/loop(): los dos
; entornos de vuelo lo excluyen.
;
; Versiones de librerías FIJAS (sin ^ ni ~): no se actualizan entre la
; prueba en el congelador y el vuelo (REQUISITOS.md §1). La versión que
; vuela se marca con el tag de Git `vuelo-1`.
;
; u-blox GNSS: la v2 ("Arduino Library"), no la v3. La v3 configura solo
; por VALGET/VALSET, que el SAM-M8Q (generación M8) no entiende: begin()
; falla siempre (REQUISITOS.md §3.1). Se baja como .zip del tag v2.2.27
; en GitHub: el registro de PlatformIO no la encuentra con esa versión, y
; un .zip no necesita git instalado (una URL .git sí).

[platformio]
default_envs = teensy41, adalogger

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; Teensy 4.1 (nivel 3) — todos los sensores científicos (REQUISITOS.md §3, §5)
; ---------------------------------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41
build_src_filter = +<*> -<adalogger/> -<banco/>
lib_deps =
    https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library/archive/refs/tags/v2.2.27.zip
    sparkfun/SparkFun SCD30 Arduino Library@1.0.20
    sparkfun/SparkFun PHT MS8607 Arduino Library@1.0.5
    adafruit/Adafruit SHT4x Library@1.0.5
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@1.3.2
    adafruit/Adafruit LTR390 Library@1.1.2
    adafruit/Adafruit MAX31865 library@1.6.2
    adafruit/Adafruit PM25 AQI Sensor@2.0.0
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
; WDT_T4 no está en lib_deps: no tiene entrada en el registro de
; PlatformIO ni releases de Git, así que bajarla por URL dejaba la
; compilación dependiendo de que GitHub responda y de que el repositorio
; siga existiendo. Está copiada en lib/WDT_T4/ desde
; https://github.com/tonton81/WDT_T4.git, commit
; 1910b57d24468cd3419959118a2e1e6192f5e7fa (MIT, LICENSE incluido).
; El Adalogger no la compila: nunca incluye Watchdog_t4.h
; (REQUISITOS.md §3.11).

; ---------------------------------------------------------------------------
; Banco de prueba por USB — los mismos módulos de src/teensy/sensores/ con
; salida por Serial, sin SD ni watchdog (src/banco/main.cpp). No vuela:
; no está en default_envs.
;   pio run -e banco -t upload && pio device monitor -e banco
; ---------------------------------------------------------------------------
[env:banco]
extends = env:teensy41
build_src_filter = +<banco/> +<teensy/sensores/>

; ---------------------------------------------------------------------------
; Prueba de la ventana IMU en el banco (REQUISITOS.md §7): el firmware de
; vuelo con el armado y el disparo cambiados para que ocurran en tierra.
; Arma enseguida (sin fix, p_hPa < 2000 siempre se cumple; con fix,
; cualquier altitud) y toma como "caída libre" |a| < 1,5 g sostenido
; 25 s, que en reposo (1 g) se cumple solo: el disparo llega ~25 s
; después de armar, con el buffer ya lleno para los 20 s previos.
; Resultado esperado: IMU_nnn.CSV de ~110 s y las líneas imu_armado,
; imu_disparo e imu_ventana en META. NO VUELA.
; ---------------------------------------------------------------------------
[env:teensy41_prueba_imu]
extends = env:teensy41
build_flags =
    ${env.build_flags}
    -DCOMETA_IMU_ARMADO_ALTITUD_M=-100000.0
    -DCOMETA_IMU_ARMADO_PRESION_HPA=2000.0
    -DCOMETA_IMU_DISPARO_CAIDA_LIBRE_G=1.5
    -DCOMETA_IMU_DISPARO_CAIDA_LIBRE_MS=25000UL
    -DCOMETA_TRAZA_ARRANQUE

; ---------------------------------------------------------------------------
; Feather M0 Adalogger (nivel 2) — posición y altitud de respaldo
; (REQUISITOS.md §2, §3, §4.5), SAM-M8Q propio (§5)
; ---------------------------------------------------------------------------
[env:adalogger]
platform = atmelsam
board = adafruit_feather_m0
build_src_filter = +<*> -<teensy/> -<banco/>
lib_deps =
    https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library/archive/refs/tags/v2.2.27.zip
    arduino-libraries/SD@1.3.0
    adafruit/Adafruit SleepyDog Library@1.8.4
