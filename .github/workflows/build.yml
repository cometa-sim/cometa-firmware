name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [teensy41, adalogger]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ matrix.environment }}-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
