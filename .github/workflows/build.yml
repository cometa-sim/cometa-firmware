name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [teensy41, adalogger, banco, teensy41_prueba_imu]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ matrix.environment }}-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      # El GPS en el bus compartido (COMETA_GPS_EN_WIRE1=0) no es el valor
      # por defecto: sin este paso esa variante no la compilaría nadie.
      - name: Build teensy41 con el GPS en Wire
        if: matrix.environment == 'teensy41'
        run: pio run -e teensy41
        env:
          PLATFORMIO_BUILD_FLAGS: -DCOMETA_GPS_EN_WIRE1=0
